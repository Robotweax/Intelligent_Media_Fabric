[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotweax-intelligent-media-fabric-lab"
version = "0.0.0"
description = "Evidence harness for Robotweax Intelligent Media Fabric"
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = []

[project.scripts]
rimf-lab = "rimf_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
