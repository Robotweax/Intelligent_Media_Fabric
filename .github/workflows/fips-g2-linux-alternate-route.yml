name: FIPS G2 Linux Alternate Route Qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fips-g2-linux-alternate-route
  cancel-in-progress: false

env:
  FIPS_COMMIT: c5aeef39ef9442d9e5047331156df368ace40cbd
  FIPS_CARGO_LOCK_SHA256: 77208a84234e33ed7fcf5b91c29f135e05a20bf23952066b28521b6e5985d24f
  FIPS_RUST_TOOLCHAIN_SHA256: 6a95738ee0eea5867a071922541a1ccaac80c63ccba5c947eb78b6130e1b22d3
  RESULT_PATH: artifacts/fips-g2-linux-alternate-route-result.json

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FIPS_SOURCE: /tmp/rimf-fips-v0.5.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install bounded Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            dnsutils \
            iproute2 \
            iputils-ping \
            libclang-dev \
            libdbus-1-dev \
            pkg-config

      - name: Prepare immutable FIPS source and toolchain
        run: |
          git init "$FIPS_SOURCE"
          git -C "$FIPS_SOURCE" remote add origin https://github.com/jmcorgan/fips.git
          git -C "$FIPS_SOURCE" fetch --depth=1 origin "$FIPS_COMMIT"
          git -C "$FIPS_SOURCE" checkout --detach FETCH_HEAD
          test "$(git -C "$FIPS_SOURCE" rev-parse HEAD)" = "$FIPS_COMMIT"
          printf '%s  %s\n' "$FIPS_CARGO_LOCK_SHA256" "$FIPS_SOURCE/Cargo.lock" |
            sha256sum --check --strict
          printf '%s  %s\n' "$FIPS_RUST_TOOLCHAIN_SHA256" "$FIPS_SOURCE/rust-toolchain.toml" |
            sha256sum --check --strict
          rustup toolchain install 1.94.1 \
            --profile minimal \
            --component rustfmt \
            --component clippy \
            --no-self-update

      - name: Restore pinned FIPS build cache
        id: fips-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/rimf-fips-v0.5.1/target
          key: ${{ runner.os }}-fips-v0.5.1-rust-1.94.1-77208a84234e

      - name: Build pinned FIPS binaries
        working-directory: ${{ env.FIPS_SOURCE }}
        run: cargo build --release --locked --bin fips --bin fipsctl

      - name: Save pinned FIPS build cache
        if: steps.fips-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/rimf-fips-v0.5.1/target
          key: ${{ steps.fips-cache.outputs.cache-primary-key }}

      - name: Run privileged four-node alternate-route qualification
        run: |
          mkdir -p artifacts
          sudo env \
            "PATH=$PATH" \
            "PYTHONPATH=$GITHUB_WORKSPACE/src" \
            python3 -m rimf_lab run-fips-g2-linux-alternate-route \
              --fips-source "$FIPS_SOURCE" \
              --fips "$FIPS_SOURCE/target/release/fips" \
              --fipsctl "$FIPS_SOURCE/target/release/fipsctl" \
              --output "$GITHUB_WORKSPACE/$RESULT_PATH" \
              --project-revision "$GITHUB_SHA"
          sudo chown "$(id -u):$(id -g)" "$RESULT_PATH"

      - name: Validate qualification result
        run: |
          PYTHONPATH=src python3 -m rimf_lab validate-fips-g2-linux-alternate-route "$RESULT_PATH"

      - name: Publish bounded job summary
        if: success()
        run: |
          {
            echo "## FIPS G2 Linux alternate-route qualification"
            echo
            echo "- Status: $(jq -r '.status' "$RESULT_PATH")"
            echo "- FIPS revision: $(jq -r '.provenance.fips_commit' "$RESULT_PATH")"
            echo "- Failed active transit: $(jq -r '.observations.failure_injection.failed_role' "$RESULT_PATH")"
            echo "- New parent: $(jq -r '.observations.automatic_reparenting.new_parent_role' "$RESULT_PATH")"
            echo "- Automatic reparenting: $(jq -r '.observations.automatic_reparenting.reparent_elapsed_ms' "$RESULT_PATH") ms"
            echo "- Manual route/connect commands: $(jq -r '.observations.automatic_reparenting.manual_route_or_connect_commands' "$RESULT_PATH")"
            echo "- Original FSP session survived tree reparenting: $(jq -r '.observations.fsp_session_recovery.established_through_reparent_control_polls' "$RESULT_PATH")"
            echo "- Automatic FSP session re-establishment: $(jq -r '.observations.fsp_session_recovery.automatic_session_reestablishment_observed' "$RESULT_PATH")"
            echo "- Recovered exact payload: $(jq -r '.observations.post_failure_payload_identity.all_exact_echo' "$RESULT_PATH")"
            echo "- Payload recovery: $(jq -r '.observations.post_failure_path.payload_recovery_elapsed_ms' "$RESULT_PATH") ms"
            echo "- Teardown complete: $(jq -r '[.cleanup[]] | all' "$RESULT_PATH")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reviewed-shape result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fips-g2-linux-alternate-route-${{ github.run_id }}
          path: ${{ env.RESULT_PATH }}
          if-no-files-found: warn
          retention-days: 14
