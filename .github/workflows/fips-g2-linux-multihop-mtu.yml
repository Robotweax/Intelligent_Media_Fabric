name: FIPS G2 Linux Multihop MTU Qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fips-g2-linux-multihop-mtu
  cancel-in-progress: false

env:
  FIPS_COMMIT: f4a5b4a8e61e340e6be7551608109a5c399f8353
  FIPS_CARGO_LOCK_SHA256: 70b1e2a25c3d626f9b4c006ab46456075f1ffdde0c2fd1a7529752aaf21e5b8a
  FIPS_RUST_TOOLCHAIN_SHA256: 6a95738ee0eea5867a071922541a1ccaac80c63ccba5c947eb78b6130e1b22d3
  RESULT_PATH: artifacts/fips-g2-linux-multihop-mtu-result.json

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FIPS_SOURCE: /tmp/rimf-fips-v0.5.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install bounded Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            iproute2 \
            iputils-ping \
            dnsutils \
            libclang-dev \
            libdbus-1-dev \
            pkg-config

      - name: Prepare immutable FIPS source and toolchain
        run: |
          git init "$FIPS_SOURCE"
          git -C "$FIPS_SOURCE" remote add origin https://github.com/jmcorgan/fips.git
          git -C "$FIPS_SOURCE" fetch --depth=1 origin "$FIPS_COMMIT"
          git -C "$FIPS_SOURCE" checkout --detach FETCH_HEAD
          test "$(git -C "$FIPS_SOURCE" rev-parse HEAD)" = "$FIPS_COMMIT"
          printf '%s  %s\n' "$FIPS_CARGO_LOCK_SHA256" "$FIPS_SOURCE/Cargo.lock" |
            sha256sum --check --strict
          printf '%s  %s\n' "$FIPS_RUST_TOOLCHAIN_SHA256" "$FIPS_SOURCE/rust-toolchain.toml" |
            sha256sum --check --strict
          rustup toolchain install 1.94.1 \
            --profile minimal \
            --component rustfmt \
            --component clippy \
            --no-self-update

      - name: Restore pinned FIPS build cache
        id: fips-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/rimf-fips-v0.5.3/target
          key: ${{ runner.os }}-fips-v0.5.3-rust-1.94.1-70b1e2a25c3d

      - name: Build pinned FIPS binaries
        working-directory: ${{ env.FIPS_SOURCE }}
        run: cargo build --release --locked --bin fips --bin fipsctl

      - name: Save pinned FIPS build cache
        if: steps.fips-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/rimf-fips-v0.5.3/target
          key: ${{ steps.fips-cache.outputs.cache-primary-key }}

      - name: Run privileged heterogeneous multihop-MTU qualification
        run: |
          mkdir -p artifacts
          sudo env \
            "PATH=$PATH" \
            "PYTHONPATH=$GITHUB_WORKSPACE/src" \
            python3 -m rimf_lab run-fips-g2-linux-multihop-mtu \
              --fips-source "$FIPS_SOURCE" \
              --fips "$FIPS_SOURCE/target/release/fips" \
              --fipsctl "$FIPS_SOURCE/target/release/fipsctl" \
              --output "$GITHUB_WORKSPACE/$RESULT_PATH" \
              --project-revision "$GITHUB_SHA"
          sudo chown "$(id -u):$(id -g)" "$RESULT_PATH"

      - name: Validate qualification result
        run: |
          PYTHONPATH=src python3 -m rimf_lab validate-fips-g2-linux-multihop-mtu "$RESULT_PATH"

      - name: Publish bounded job summary
        if: success()
        run: |
          {
            echo "## FIPS G2 Linux heterogeneous multihop-MTU qualification"
            echo
            echo "- Status: $(jq -r '.status' "$RESULT_PATH")"
            echo "- FIPS revision: $(jq -r '.provenance.fips_commit' "$RESULT_PATH")"
            echo "- UDP MTUs A/R/B: $(jq -r '.topology.configured_udp_mtu_per_node | join(\" / \")' "$RESULT_PATH") bytes"
            echo "- Learned transport PMTU: $(jq -r '.observations.path_mtu.learned_transport_path_mtu' "$RESULT_PATH") bytes"
            echo "- Effective IPv6 PMTU: $(jq -r '.observations.path_mtu.effective_ipv6_path_mtu' "$RESULT_PATH") bytes"
            echo "- ICMPv6 PTB reported MTU: $(jq -r '.observations.path_mtu.reported_mtu' "$RESULT_PATH") bytes"
            echo "- Payload sizes: $(jq -r '[.observations.payload_identity.records[].bytes] | join(\", \")' "$RESULT_PATH") bytes"
            echo "- Teardown complete: $(jq -r '[.cleanup[]] | all' "$RESULT_PATH")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reviewed-shape result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fips-g2-linux-multihop-mtu-${{ github.run_id }}
          path: ${{ env.RESULT_PATH }}
          if-no-files-found: warn
          retention-days: 14
